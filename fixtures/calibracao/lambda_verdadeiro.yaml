# Lambda verdadeiro por classe taxonômica — gabarito de calibração
#
# Derivado de ISO 14224:2016 Tabelas B.x (medianas de campo publicadas).
# lambda_ref_1e6h (falhas por 10^6 horas de operação) convertido para
# lambda_por_hora_operacao = lambda_ref_1e6h / 1_000_000.
#
# Usado pelo gerador (F2) e pelo teste de calibração para verificar
# que o estimador recupera lambda dentro do IC 95%.

classes:
  - classe_id: "CT-BCC"
    descricao: "Bomba centrífuga"
    lambda_ref_1e6h: 1200
    lambda_por_hora_operacao: 0.0012
    unidade: "falhas/hora"

