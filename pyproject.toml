[project]
name = "datamint-demo-ilos"
version = "0.1.0"
description = "Demo ILOS — agentes sobre grafo de conhecimento de ativos industriais"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.6,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.11,<3",
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "pyyaml>=6.0,<7",
    "anthropic>=0.52,<1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ontology*", "intents*", "scoring*", "api*", "seed*", "vocab*", "db*"]

[tool.ruff]
target-version = "py312"
line-length = 100
